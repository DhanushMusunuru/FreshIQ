<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640"
     role="img" aria-label="FreshIQ block diagram. The USB camera feeds the UNO Q Linux processor, which runs a quality gate, a TFLite model and the scan controller. The scan controller calls the on-board STM32 over MessagePack-RPC, which drives the A4988 and the NEMA 17, turning the tray to the next compartment and returning to the camera.">
  <title>FreshIQ — system block diagram</title>
  <defs>
    <marker id="b-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16201C"/>
    </marker>
    <marker id="b-arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0A6B66"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#FFFFFF"/>

  <g font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, monospace">

    <!-- ============ UNO Q envelope ============ -->
    <rect x="228" y="52" width="612" height="196" rx="10" fill="#F4F7F5"
          stroke="#0A6B66" stroke-width="1.6" stroke-dasharray="8 5"/>
    <text x="246" y="78" font-size="13" font-weight="700" fill="#0A6B66">ARDUINO UNO Q &#183; Linux MPU (Qualcomm)</text>

    <!-- pipeline inside -->
    <rect x="250" y="108" width="164" height="72" rx="7" fill="#FFFFFF" stroke="#16201C" stroke-width="1.5"/>
    <text x="332" y="138" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16201C">Quality gate</text>
    <text x="332" y="157" text-anchor="middle" font-size="10.5" fill="#41534A">blur / dark / count</text>

    <rect x="440" y="108" width="176" height="72" rx="7" fill="#FFFFFF" stroke="#16201C" stroke-width="1.5"/>
    <text x="528" y="132" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16201C">TFLite model</text>
    <text x="528" y="150" text-anchor="middle" font-size="10.5" fill="#41534A">MobileNetV2 &#183; 160 px</text>
    <text x="528" y="166" text-anchor="middle" font-size="10.5" fill="#41534A">2 heads: food + condition</text>

    <rect x="642" y="108" width="176" height="72" rx="7" fill="#FFFFFF" stroke="#16201C" stroke-width="1.5"/>
    <text x="730" y="132" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16201C">Scan controller</text>
    <text x="730" y="150" text-anchor="middle" font-size="10.5" fill="#41534A">state machine</text>
    <text x="730" y="166" text-anchor="middle" font-size="10.5" fill="#41534A">owns compartment #</text>

    <rect x="250" y="196" width="568" height="36" rx="6" fill="#FFFFFF" stroke="#7A8A82" stroke-width="1.2"/>
    <text x="534" y="220" text-anchor="middle" font-size="11" fill="#41534A">HTTP server :8000 &#8212; dashboard, REST API, JSONL history</text>

    <!-- ============ camera ============ -->
    <rect x="40" y="108" width="160" height="72" rx="7" fill="#FFFFFF" stroke="#16201C" stroke-width="1.5"/>
    <text x="120" y="138" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16201C">USB camera</text>
    <text x="120" y="157" text-anchor="middle" font-size="10.5" fill="#41534A">1/4 in CMOS &#183; UVC</text>
    <path d="M202 144 L248 144" stroke="#16201C" stroke-width="2" marker-end="url(#b-ar)"/>

    <!-- pipeline arrows -->
    <path d="M416 144 L438 144" stroke="#16201C" stroke-width="2" marker-end="url(#b-ar)"/>
    <path d="M618 144 L640 144" stroke="#16201C" stroke-width="2" marker-end="url(#b-ar)"/>

    <!-- ============ dashboard ============ -->
    <rect x="900" y="96" width="176" height="96" rx="7" fill="#FFFFFF" stroke="#16201C" stroke-width="1.5"/>
    <text x="988" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16201C">Phone / laptop</text>
    <text x="988" y="147" text-anchor="middle" font-size="10.5" fill="#41534A">dashboard on the</text>
    <text x="988" y="163" text-anchor="middle" font-size="10.5" fill="#41534A">same Wi-Fi</text>
    <path d="M842 144 L898 144" stroke="#16201C" stroke-width="2"
          marker-end="url(#b-ar)" marker-start="url(#b-ar)"/>
    <text x="870" y="136" text-anchor="middle" font-size="10" fill="#41534A">LAN</text>

    <!-- ============ MPU -> MCU ============ -->
    <path d="M730 250 L730 330" stroke="#0A6B66" stroke-width="2.4" marker-end="url(#b-arT)"/>
    <text x="744" y="278" font-size="11.5" font-weight="700" fill="#0A6B66">MessagePack-RPC</text>
    <text x="744" y="295" font-size="10.5" fill="#0A6B66">arduino-router socket</text>
    <text x="744" y="312" font-size="10" fill="#7A8A82">internal UART, not USB</text>

    <!-- ============ MCU row ============ -->
    <rect x="640" y="332" width="180" height="84" rx="7" fill="#F4F7F5" stroke="#0A6B66" stroke-width="1.8"/>
    <text x="730" y="362" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16201C">STM32U585 MCU</text>
    <text x="730" y="380" text-anchor="middle" font-size="10.5" fill="#41534A">on the same board</text>
    <text x="730" y="397" text-anchor="middle" font-size="10.5" fill="#41534A">real-time step timing</text>

    <rect x="440" y="332" width="160" height="84" rx="7" fill="#FFFFFF" stroke="#16201C" stroke-width="1.5"/>
    <text x="520" y="368" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16201C">A4988</text>
    <text x="520" y="387" text-anchor="middle" font-size="10.5" fill="#41534A">stepper driver</text>

    <rect x="250" y="332" width="150" height="84" rx="7" fill="#FFFFFF" stroke="#16201C" stroke-width="1.5"/>
    <text x="325" y="362" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16201C">NEMA 17</text>
    <text x="325" y="381" text-anchor="middle" font-size="10.5" fill="#41534A">200 steps/rev</text>
    <text x="325" y="398" text-anchor="middle" font-size="10.5" fill="#41534A">1:1 direct drive</text>

    <rect x="40" y="332" width="170" height="84" rx="7" fill="#FFFFFF" stroke="#16201C" stroke-width="1.8"/>
    <text x="125" y="362" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16201C">Rotating tray</text>
    <text x="125" y="381" text-anchor="middle" font-size="10.5" fill="#41534A">4 compartments</text>
    <text x="125" y="398" text-anchor="middle" font-size="10.5" fill="#41534A">50 steps each</text>

    <path d="M638 374 L602 374" stroke="#16201C" stroke-width="2" marker-end="url(#b-ar)"/>
    <text x="620" y="366" text-anchor="middle" font-size="10" fill="#41534A">STEP</text>
    <path d="M438 374 L402 374" stroke="#16201C" stroke-width="2" marker-end="url(#b-ar)"/>
    <text x="420" y="366" text-anchor="middle" font-size="10" fill="#41534A">coils</text>
    <path d="M248 374 L212 374" stroke="#16201C" stroke-width="2" marker-end="url(#b-ar)"/>

    <!-- ============ the loop closes ============ -->
    <path d="M125 330 L125 190" stroke="#16201C" stroke-width="2" marker-end="url(#b-ar)"/>
    <text x="112" y="262" text-anchor="end" font-size="11" fill="#16201C">next</text>
    <text x="112" y="278" text-anchor="end" font-size="11" fill="#16201C">compartment</text>

    <!-- ============ sequence caption ============ -->
    <line x1="40" y1="470" x2="1160" y2="470" stroke="#16201C" stroke-width="0.8" opacity=".45"/>
    <text x="40" y="498" font-size="12.5" font-weight="700" fill="#16201C">ONE COMPARTMENT, IN ORDER</text>
    <g font-size="11.5" fill="#41534A">
      <text x="40" y="522">1.  Scan controller asks the MCU to turn exactly 50 steps and WAITS for the RPC reply.</text>
      <text x="40" y="542">2.  Reply arrives only after the motor has stopped &#8212; then a settle delay lets the platter stop swinging.</text>
      <text x="40" y="562">3.  Camera captures. The tray is stationary; this is the only moment the shutter opens.</text>
      <text x="40" y="582">4.  Quality gate rejects blurred, dark or multi-object frames before the model runs.</text>
      <text x="40" y="602">5.  Model returns food + condition; the controller attaches the compartment number and saves the result.</text>
      <text x="40" y="622">6.  Repeat for all 4 compartments, then report COMPLETE. Any error de-energises the motor first.</text>
    </g>

  </g>
</svg>
